services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: manuable
      POSTGRES_USER: manuable
      POSTGRES_PASSWORD: manuable_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manuable -d manuable"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://manuable:manuable_dev@db:5432/manuable
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminlocalonly}
      # Solo para demos: fija "hoy" (ej. 2026-12-01T10:00:00). Vacío = fecha real.
      FECHA_SIMULADA: ${FECHA_SIMULADA:-}
    ports:
      - "8000:8000"
    volumes:
      - ./datos:/app/datos:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend-angular
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
